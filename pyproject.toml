[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "airwise-ai"
version = "0.1.0"
description = "Evidence-based urban air quality assistant"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.165.0",
  "httpx==0.28.1",
  "pydantic-settings==2.7.1",
  "slowapi==0.1.10",
  "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
dev = [
  "mypy==1.15.0",
  "pip-audit==2.10.1",
  "pre-commit==4.1.0",
  "pytest==9.0.3",
  "pytest-asyncio==1.3.0",
  "pytest-cov==7.0.0",
  "respx==0.22.0",
  "ruff==0.9.6",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "."
exclude = ["tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 90
show_missing = true
