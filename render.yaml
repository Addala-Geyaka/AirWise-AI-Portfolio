services:
  - type: web
    name: airwise-ai-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.lock
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_CORS_ORIGINS
        sync: false
